version: '3.9'
services:
  mongo:
    image: mongo:6
    container_name: codechef-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  backend:
    build: ./backend
    container_name: codechef-backend
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=codechef_onboarding
      - JWT_SECRET=change-this-secret
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      - mongo
volumes:
  mongo_data:
